[project]
name = "google-maps-reviews-scraper"
version = "0.2.0"
description = "Scrape all Google Maps reviews for any place — free, no API key, unlimited reviews"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
keywords = ["google-maps", "reviews", "scraper", "playwright", "data"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Searching",
]
dependencies = [
    "playwright>=1.44",
    "typer>=0.12",
    "rich>=13",
]

[project.optional-dependencies]
analyze = [
    "transformers>=4.40",
    "torch>=2.2",
    "bertopic>=0.16",
    "sentence-transformers>=3.0",
]
analysis = ["pandas>=2.0", "pyarrow>=14.0", "openpyxl>=3.1", "textblob>=0.18"]
web = ["fastapi>=0.111", "uvicorn[standard]>=0.29"]
all = ["pandas>=2.0", "pyarrow>=14.0", "openpyxl>=3.1", "textblob>=0.18", "fastapi>=0.111", "uvicorn[standard]>=0.29"]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/aroaxinping/google-maps-reviews-scraper"
"Bug Tracker" = "https://github.com/aroaxinping/google-maps-reviews-scraper/issues"
Documentation = "https://aroaxinping.github.io/google-maps-reviews-scraper/"

[project.scripts]
gmaps-reviews = "gmaps_reviews.cli:app"
gmaps-reviews-web = "gmaps_reviews.web_ui:app"

[tool.hatch.build.targets.wheel]
packages = ["gmaps_reviews"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
